<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>個人進度儀表板</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入手機觸控拖曳套件 (讓手機端也能支援 Drag & Drop) -->
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            navy: '#2C3E50',
                            'navy-light': '#3E5771',
                            burgundy: '#7A4B4E',
                            'burgundy-light': '#966064'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .drag-active { border: 2px dashed #3E5771 !important; background-color: #f1f5f9 !important; }
        .checkbox-custom:checked + div { background-color: #2C3E50; border-color: #2C3E50; }
        .checkbox-custom:checked + div svg { opacity: 1; }
        
        /* 標籤顏色定義 */
        .tag-yellow { color: #b45309; background-color: #fef3c7; }
        .tag-rose { color: #9f1239; background-color: #ffe4e6; }
        .tag-blue { color: #1d4ed8; background-color: #eff6ff; }
        .tag-emerald { color: #047857; background-color: #d1fae5; }
        .tag-purple { color: #6d28d9; background-color: #ede9fe; }
        .tag-slate { color: #475569; background-color: #f1f5f9; }

        /* 手機端隱藏水平捲軸但保留滑動功能 */
        @media (max-width: 768px) {
            .hide-scrollbar-mobile::-webkit-scrollbar { display: none; }
            .hide-scrollbar-mobile { -ms-overflow-style: none; scrollbar-width: none; }
            #view-dashboard, #view-archive, #view-settings { padding-bottom: env(safe-area-inset-bottom); }
        }
    </style>
</head>
<body class="bg-slate-50 flex flex-col md:flex-row h-screen text-slate-800 antialiased overflow-hidden">

    <!-- 側邊欄 (手機版自動變為頂部導覽列) -->
    <aside class="w-full md:w-64 bg-theme-navy text-white flex flex-col shadow-xl z-20 shrink-0 relative transition-all duration-300">
        
        <!-- 頂部標題與手機版倒數計時 -->
        <div class="p-3 md:p-6 border-b border-white/10 flex justify-between items-center md:block shrink-0 pt-[max(env(safe-area-inset-top),_12px)]">
            <div>
                <h1 class="text-base md:text-xl font-bold tracking-wider flex items-center">
                    <i class="fa-solid fa-layer-group mr-2 md:mr-3 opacity-80"></i> 進度儀表板
                </h1>
                <p class="hidden md:block text-xs text-slate-400 mt-1">年度專案管理系統</p>
            </div>
            
            <div class="flex md:hidden items-center gap-2">
                <button onclick="undoLastAction()" id="mobile-undo-btn" class="text-xs bg-theme-burgundy text-white w-7 h-7 flex items-center justify-center rounded opacity-50 cursor-not-allowed border border-white/20 active:scale-95 transition-transform">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <div class="text-[10px] font-bold bg-slate-800/80 px-2 py-1.5 rounded flex items-center border border-white/10">
                    <i class="fa-solid fa-flag-checkered text-amber-400 mr-1.5"></i>
                    倒數 <span id="mobile-countdown-days" class="text-amber-400 text-xs mx-1">--</span> 天
                </div>
            </div>
        </div>

        <!-- 電腦版專屬大型倒數計時與復原按鈕 -->
        <div class="hidden md:block px-6 py-5 border-b border-white/10 relative shrink-0">
            <div class="bg-slate-800/50 rounded-lg p-4 border border-white/5 text-center">
                <p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest mb-1">階段性目標倒數</p>
                <div class="text-3xl font-bold text-white flex items-baseline justify-center">
                    <span id="countdown-days">--</span>
                    <span class="text-xs font-normal text-slate-400 ml-1">天</span>
                </div>
            </div>
            <button onclick="undoLastAction()" id="undo-btn" class="absolute -bottom-3 left-1/2 transform -translate-x-1/2 bg-theme-burgundy text-white text-[10px] px-4 py-1.5 rounded-full shadow-lg opacity-50 cursor-not-allowed transition-all flex items-center border border-white/20 hover:scale-105">
                <i class="fa-solid fa-rotate-left mr-1.5"></i> 復原上一步
            </button>
        </div>

        <!-- 日曆月份切換列 -->
        <div class="p-2 md:px-6 md:py-5 border-b border-white/10 flex items-center justify-between md:block gap-2 shrink-0 bg-theme-navy">
            <h3 class="hidden md:block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">日曆導覽</h3>
            
            <div class="flex items-center bg-white/5 rounded-lg p-1 flex-1 md:flex-none justify-between border border-white/5">
                <button onclick="changeMonth(-1)" class="p-1.5 md:p-2 hover:bg-white/10 rounded transition text-slate-300"><i class="fa-solid fa-chevron-left text-xs md:text-sm"></i></button>
                <span id="current-month-display" class="font-medium text-xs md:text-sm tracking-wide px-2 text-slate-200"></span>
                <button onclick="changeMonth(1)" class="p-1.5 md:p-2 hover:bg-white/10 rounded transition text-slate-300"><i class="fa-solid fa-chevron-right text-xs md:text-sm"></i></button>
            </div>

            <div class="hidden md:block bg-slate-800/50 rounded-lg p-3 text-center border border-white/5 mt-4 shadow-inner">
                <p class="text-[10px] text-slate-400 mb-1">今日</p>
                <p id="today-date-display" class="text-sm font-semibold text-slate-200"></p>
            </div>
            
            <button onclick="resetToToday()" class="whitespace-nowrap text-[10px] md:text-xs text-slate-400 hover:text-white transition flex items-center justify-center px-3 py-1.5 md:py-2 md:mt-3 bg-white/5 rounded-lg hover:bg-white/10 border border-white/5">
                <i class="fa-solid fa-calendar-day mr-1.5 md:mr-2"></i> 返回今日
            </button>
        </div>

        <!-- 導覽標籤區 (手機版橫向滑動) -->
        <nav class="flex md:flex-col overflow-x-auto p-2 md:p-4 gap-2 md:gap-0 md:space-y-2 shrink-0 hide-scrollbar-mobile bg-theme-navy/95 border-b md:border-b-0 border-white/10">
            <button onclick="changeTab('dashboard')" id="nav-dashboard" class="whitespace-nowrap shrink-0 flex items-center px-3 md:px-4 py-2 md:py-3 text-[11px] md:text-sm rounded-lg bg-theme-navy-light text-white font-medium transition-colors border border-transparent">
                <i class="fa-solid fa-border-all mr-2 md:w-6 text-center"></i> 總覽排程
            </button>
            <button onclick="changeTab('archive')" id="nav-archive" class="whitespace-nowrap shrink-0 flex items-center px-3 md:px-4 py-2 md:py-3 text-[11px] md:text-sm rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-colors border border-transparent">
                <i class="fa-solid fa-book-journal-whills mr-2 md:w-6 text-center"></i> 知識與備忘總表
            </button>
            <button onclick="changeTab('settings')" id="nav-settings" class="whitespace-nowrap shrink-0 flex items-center px-3 md:px-4 py-2 md:py-3 text-[11px] md:text-sm rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-colors border border-transparent">
                <i class="fa-solid fa-sliders mr-2 md:w-6 text-center"></i> 專案排程設定
            </button>
        </nav>
        
        <div class="hidden md:block p-4 border-t border-white/10 text-[10px] text-slate-500 text-center uppercase tracking-widest mt-auto">
            System Online
        </div>
    </aside>

    <!-- 總覽排程主視窗 -->
    <main id="view-dashboard" class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 relative">
        
        <!-- 頂部輸入區塊 (手機版橫向滑動) -->
        <header class="bg-white border-b border-slate-200 shrink-0 z-10 p-3 md:p-4 shadow-sm">
            <div class="max-w-full mx-auto">
                <div class="flex overflow-x-auto snap-x snap-mandatory gap-3 pb-1 md:grid md:grid-cols-3 md:gap-4 md:pb-0 hide-scrollbar-mobile">
                    
                    <!-- 隨筆備忘錄 -->
                    <div class="snap-center shrink-0 w-[80vw] md:w-auto bg-slate-50 p-2.5 md:p-3 rounded-lg border border-slate-200 flex flex-col">
                        <div class="text-[10px] font-bold text-theme-navy mb-1.5 uppercase tracking-wide flex justify-between items-center">
                            <span><i class="fa-solid fa-pen mr-1 opacity-70"></i>隨筆備忘錄</span>
                            <span class="text-[9px] text-slate-400 font-normal bg-white px-1 py-0.5 rounded shadow-sm">打勾存入總表</span>
                        </div>
                        <div class="flex flex-grow relative">
                            <textarea id="memo-input" placeholder="隨手記下想法..." class="w-full text-[11px] md:text-xs p-2 pr-8 border border-slate-300 rounded focus:outline-none focus:border-theme-navy focus:ring-1 focus:ring-theme-navy resize-none shadow-inner" rows="2"></textarea>
                            <button onclick="saveToArchive('memo')" class="absolute bottom-1 right-1 text-slate-400 hover:text-theme-navy hover:bg-slate-100 p-1.5 rounded transition"><i class="fa-solid fa-check text-sm md:text-base"></i></button>
                        </div>
                    </div>
                    
                    <!-- 知識點追蹤 -->
                    <div class="snap-center shrink-0 w-[80vw] md:w-auto bg-slate-50 p-2.5 md:p-3 rounded-lg border border-slate-200 flex flex-col">
                        <div class="text-[10px] font-bold text-theme-burgundy mb-1.5 uppercase tracking-wide flex justify-between items-center">
                            <span><i class="fa-solid fa-lightbulb mr-1 opacity-70"></i>知識點追蹤</span>
                            <span class="text-[9px] text-slate-400 font-normal bg-white px-1 py-0.5 rounded shadow-sm">打勾存入總表</span>
                        </div>
                        <div class="flex flex-grow relative">
                            <textarea id="knowledge-input" placeholder="記下今日學習重點..." class="w-full text-[11px] md:text-xs p-2 pr-8 border border-slate-300 rounded focus:outline-none focus:border-theme-burgundy focus:ring-1 focus:ring-theme-burgundy resize-none shadow-inner" rows="2"></textarea>
                            <button onclick="saveToArchive('knowledge')" class="absolute bottom-1 right-1 text-slate-400 hover:text-theme-burgundy hover:bg-slate-100 p-1.5 rounded transition"><i class="fa-solid fa-check text-sm md:text-base"></i></button>
                        </div>
                    </div>
                    
                    <!-- 長期待辦里程碑 -->
                    <div class="snap-center shrink-0 w-[80vw] md:w-auto bg-slate-50 p-2.5 md:p-3 rounded-lg border border-slate-200 flex flex-col">
                        <div class="text-[10px] font-bold text-amber-700 mb-1.5 uppercase tracking-wide flex justify-between items-center">
                            <span><i class="fa-solid fa-flag mr-1 opacity-70"></i>長期待辦里程碑</span>
                            <span class="text-[9px] text-slate-400 font-normal bg-white px-1 py-0.5 rounded shadow-sm">打勾存入總表</span>
                        </div>
                        <div class="flex flex-grow relative">
                            <textarea id="milestone-input" placeholder="例如: 辦理簽證、報名考試..." class="w-full text-[11px] md:text-xs p-2 pr-8 border border-slate-300 rounded focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-500 resize-none shadow-inner" rows="2"></textarea>
                            <button onclick="saveToArchive('milestone')" class="absolute bottom-1 right-1 text-slate-400 hover:text-amber-700 hover:bg-slate-100 p-1.5 rounded transition"><i class="fa-solid fa-check text-sm md:text-base"></i></button>
                        </div>
                    </div>
                    
                </div>
            </div>
        </header>

        <!-- 日曆渲染區 (支援垂直捲動) -->
        <div class="flex-1 overflow-y-auto p-3 md:p-6 custom-scrollbar bg-slate-50">
            <div class="max-w-full mx-auto pb-10">
                <div id="calendar-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4">
                    <!-- Calendar days will be rendered here -->
                </div>
            </div>
        </div>
    </main>

    <!-- 知識與備忘總表視窗 -->
    <main id="view-archive" class="hidden flex-1 flex flex-col h-full overflow-y-auto bg-slate-50 p-4 md:p-6 pb-20">
        <div class="max-w-6xl mx-auto w-full fade-in">
            <h2 class="text-lg md:text-xl font-bold text-theme-navy mb-4 md:mb-6 flex items-center">
                <i class="fa-solid fa-book-journal-whills mr-2 opacity-80"></i>知識與備忘總表
            </h2>
            
            <div class="flex flex-col lg:flex-row gap-6">
                <!-- 左側：筆記與知識點 -->
                <div class="flex-1">
                    <div class="flex flex-wrap gap-2 mb-4">
                        <button onclick="setArchiveFilter('all')" id="btn-arc-all" class="px-3 md:px-4 py-1.5 md:py-2 text-[11px] md:text-xs font-medium rounded-lg bg-theme-navy text-white shadow-sm transition">全部紀錄</button>
                        <button onclick="setArchiveFilter('knowledge')" id="btn-arc-knowledge" class="px-3 md:px-4 py-1.5 md:py-2 text-[11px] md:text-xs font-medium rounded-lg bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition"><i class="fa-solid fa-lightbulb text-theme-burgundy opacity-70 mr-1"></i> 知識點</button>
                        <button onclick="setArchiveFilter('memo')" id="btn-arc-memo" class="px-3 md:px-4 py-1.5 md:py-2 text-[11px] md:text-xs font-medium rounded-lg bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition"><i class="fa-solid fa-pen text-theme-navy opacity-60 mr-1"></i> 隨筆備忘</button>
                    </div>
                    <div id="archive-notes-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                        <!-- Notes -->
                    </div>
                </div>

                <!-- 右側：長期待辦里程碑 -->
                <div class="w-full lg:w-80 shrink-0">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden sticky top-4">
                        <div class="bg-amber-50 px-4 py-3 border-b border-amber-100 flex justify-between items-center">
                            <h3 class="font-bold text-amber-800 text-sm"><i class="fa-solid fa-flag mr-1.5 opacity-80"></i> 里程碑追蹤</h3>
                        </div>
                        <div id="archive-milestone-container" class="p-4 space-y-3 max-h-[60vh] overflow-y-auto custom-scrollbar">
                            <!-- Milestones -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 專案排程設定視窗 -->
    <main id="view-settings" class="hidden flex-1 flex flex-col h-full overflow-y-auto bg-slate-50 p-4 md:p-6 pb-20">
        <div class="max-w-6xl mx-auto w-full bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden fade-in">
            <div class="bg-theme-navy px-4 md:px-6 py-4 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                <div>
                    <h2 class="text-base md:text-lg font-bold flex items-center"><i class="fa-solid fa-sliders mr-2 opacity-80"></i> 專案排程與資源設定</h2>
                    <p class="text-[10px] md:text-xs text-slate-300 mt-1">調整完畢後請點擊儲存，系統將自動重新運算所有課表。</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="openTagManager()" class="text-[11px] md:text-xs bg-theme-navy-light hover:bg-slate-600 text-white px-3 py-1.5 rounded transition font-medium border border-white/20 flex items-center shadow-sm">
                        <i class="fa-solid fa-tags mr-1"></i> 標籤管理
                    </button>
                    <button onclick="addNewCourseUI()" class="text-[11px] md:text-xs bg-white hover:bg-slate-100 text-theme-navy px-3 py-1.5 rounded transition font-medium border border-slate-200 flex items-center shadow-sm">
                        <i class="fa-solid fa-plus mr-1"></i> 新增排程資源
                    </button>
                </div>
            </div>
            
            <div class="p-4 md:p-6 space-y-6">
                <!-- 整體時間設定區 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 md:gap-4">
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 shadow-sm">
                        <label class="block text-[11px] md:text-xs font-bold text-slate-500 mb-1">計畫起始日</label>
                        <input type="date" id="set-start-date" class="w-full p-2 text-xs md:text-sm border border-slate-300 rounded focus:border-theme-navy focus:outline-none bg-white">
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 shadow-sm">
                        <label class="block text-[11px] md:text-xs font-bold text-slate-500 mb-1" title="系統能推算的最後一天 (例如 IT 專案全數結束)">排程系統最大邊界日</label>
                        <input type="date" id="set-max-deadline" class="w-full p-2 text-xs md:text-sm border border-slate-300 rounded focus:border-theme-navy focus:outline-none bg-white">
                    </div>
                    <div class="bg-blue-50 p-3 rounded-lg border border-blue-200 shadow-sm">
                        <label class="block text-[11px] md:text-xs font-bold text-blue-800 mb-1" title="儀表板顯示的倒數計時目標日">倒數計時基準日 (如考前)</label>
                        <input type="date" id="set-countdown-date" class="w-full p-2 text-xs md:text-sm border border-blue-300 rounded focus:border-blue-600 focus:outline-none bg-white text-blue-900">
                    </div>
                </div>
                
                <hr class="border-slate-100">
                
                <div class="mb-2">
                    <h3 class="text-sm font-bold text-theme-navy flex items-center"><i class="fa-solid fa-list-check mr-2 opacity-70"></i>專案清單與週期設定</h3>
                    <p class="text-[10px] text-slate-400 mt-1">同標籤下，優先順序數字越小將越先排程；若到達「單獨截止日」，系統將強制停止排定該資源。</p>
                </div>
                
                <div id="courses-list-container" class="grid grid-cols-1 gap-4 max-h-[50vh] overflow-y-auto pr-1 md:pr-2 custom-scrollbar">
                    <!-- 圖形化卡片渲染區 -->
                </div>
                
                <div class="text-right mt-6 border-t border-slate-100 pt-4 pb-4">
                    <button onclick="saveSettings()" class="w-full md:w-auto bg-theme-navy hover:bg-theme-navy-light text-white px-6 py-3 rounded-lg shadow-md text-sm font-bold transition flex items-center justify-center ml-auto active:scale-[0.98]">
                        <i class="fa-solid fa-save mr-2"></i> 儲存並重新鋪排課表
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 拖曳異動確認 Modal -->
    <div id="drag-confirm-modal" class="hidden fixed inset-0 bg-slate-900/60 z-[100] flex items-center justify-center backdrop-blur-sm transition-opacity p-4">
        <div class="bg-white rounded-xl shadow-2xl p-5 md:p-6 max-w-sm w-full border border-slate-200 fade-in">
            <div class="flex items-center text-theme-navy mb-3 md:mb-4" id="drag-modal-title">
                <i class="fa-solid fa-layer-group text-xl md:text-2xl mr-3"></i>
                <h3 class="text-base md:text-lg font-bold">排程異動確認</h3>
            </div>
            <p class="text-[13px] md:text-sm text-slate-600 mb-5 md:mb-6 leading-relaxed" id="drag-modal-desc">您正在將系統排定的章節變更日期。</p>
            <div class="space-y-3">
                <button onclick="handleDragChoice('cascade')" class="w-full flex flex-col items-center justify-center p-3 bg-theme-navy text-white rounded-lg hover:bg-theme-navy-light transition shadow-sm border border-theme-navy active:scale-[0.98]">
                    <span class="font-bold text-[13px] md:text-sm mb-1" id="drag-modal-cascade-text"><i class="fa-solid fa-forward-step mr-1"></i> 整串自動順延 (推薦)</span>
                    <span class="text-[9px] md:text-[10px] text-slate-300" id="drag-modal-cascade-sub">此科目後續的章節將自動往後推遲排程</span>
                </button>
                <button onclick="handleDragChoice('single')" class="w-full flex flex-col items-center justify-center p-3 bg-white text-slate-700 rounded-lg hover:bg-slate-50 transition border border-slate-200 active:scale-[0.98]">
                    <span class="font-bold text-[13px] md:text-sm mb-1"><i class="fa-solid fa-arrow-right-to-bracket mr-1"></i> 僅移動此卡片</span>
                    <span class="text-[9px] md:text-[10px] text-slate-400">當作特例手動移入，後續章節排程不受影響</span>
                </button>
                <button onclick="closeDragModal()" class="w-full py-2 mt-2 text-[11px] md:text-xs text-slate-400 hover:text-slate-600 transition underline">取消操作，卡片回原位</button>
            </div>
        </div>
    </div>

    <!-- 標籤分類管理 Modal -->
    <div id="tag-manager-modal" class="hidden fixed inset-0 bg-slate-900/60 z-[110] flex items-center justify-center backdrop-blur-sm transition-opacity p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 fade-in flex flex-col max-h-[85vh]">
            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-xl">
                <h3 class="text-sm md:text-md font-bold text-theme-navy"><i class="fa-solid fa-tags mr-2 opacity-70"></i>標籤分類管理</h3>
                <button onclick="closeTagManager()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-times text-lg"></i></button>
            </div>
            <div class="p-5 overflow-y-auto flex-grow custom-scrollbar">
                <div class="flex flex-col md:flex-row gap-2 mb-6 bg-slate-50 p-3 rounded-lg border border-slate-200 shadow-sm">
                    <input type="text" id="new-tag-name" placeholder="輸入新標籤名稱" class="w-full text-xs p-2 border border-slate-300 rounded focus:border-theme-navy focus:outline-none">
                    <div class="flex gap-2">
                        <select id="new-tag-color" class="flex-1 md:w-auto text-xs p-2 border border-slate-300 rounded focus:border-theme-navy focus:outline-none bg-white">
                            <option value="blue">海藍</option>
                            <option value="rose">酒紅</option>
                            <option value="yellow">暖橘</option>
                            <option value="emerald">翠綠</option>
                            <option value="purple">沉紫</option>
                            <option value="slate">灰階</option>
                        </select>
                        <button onclick="addTag()" class="bg-theme-navy hover:bg-theme-navy-light text-white px-4 py-2 rounded text-xs font-medium transition whitespace-nowrap active:scale-95">新增</button>
                    </div>
                </div>
                <p class="text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-wide">現有標籤清單</p>
                <div id="tags-list-container" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        // 核心常數與狀態
        const REAL_TODAY = new Date(); 
        let currentDisplayYear = REAL_TODAY.getFullYear();
        let currentDisplayMonth = REAL_TODAY.getMonth();
        let currentArchiveFilter = 'all';

        // 強制當地時區解析 (解決跨時區導致少一天的 Bug)
        function parseDateStr(ds) {
            if (!ds) return new Date();
            const parts = ds.split('-');
            if(parts.length === 3) {
                return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]), 0, 0, 0);
            }
            return new Date();
        }

        function formatDateStr(d) {
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${d.getFullYear()}-${mm}-${dd}`;
        }

        let historyStack = [];
        let dragContext = null;

        // V4.3 強制升級：載入最新預設課表與循環機制
        if (localStorage.getItem('deleAppVersion') !== 'v4.3') {
            localStorage.removeItem('deleAppSettings');
            localStorage.setItem('deleAppVersion', 'v4.3');
        }

        let appSettings = JSON.parse(localStorage.getItem('deleAppSettings') || 'null');
        if (!appSettings) {
            appSettings = {
                startDate: '2026-10-01',
                maxDeadline: '2028-03-31',
                countdownDate: '2027-11-10',
                categories: [
                    { id: 'cat_vocab', name: '單字詞彙', color: 'yellow' },
                    { id: 'cat_spanish', name: '西語核心', color: 'rose' },
                    { id: 'cat_it', name: 'IT與程式', color: 'blue' }
                ],
                courses: [
                    { id: 'c_vocab', title: 'DELE B2 精選詞彙', total: 195, daily: 1, loops: 3, days: [0,1,2,3,4,5,6], cat: 'cat_vocab', order: 1, deadline: '2027-11-10' },
                    { id: 'c_sp1', title: '現西第三冊', total: 20, daily: 1, loops: 1, days: [0,1,2,3,4,5,6], cat: 'cat_spanish', order: 2, deadline: '2027-11-10' },
                    { id: 'c_sp2', title: '小西Spanish学习素材100期', total: 25, daily: 1, loops: 1, days: [0,1,2,3,4,5,6], cat: 'cat_spanish', order: 3, deadline: '2027-11-10' },
                    { id: 'c_sp3', title: '[Udemy] Complete Spanish Course', total: 20, daily: 1, loops: 1, days: [0,1,2,3,4,5,6], cat: 'cat_spanish', order: 4, deadline: '2027-11-10' },
                    { id: 'c_sp4', title: 'Espñol Ágil', total: 20, daily: 1, loops: 1, days: [0,1,2,3,4,5,6], cat: 'cat_spanish', order: 5, deadline: '2027-11-10' },
                    { id: 'c_sp5', title: '[Udemy] 300 Spanish Idioms', total: 10, daily: 1, loops: 1, days: [0,1,2,3,4,5,6], cat: 'cat_spanish', order: 6, deadline: '2027-11-10' },
                    { id: 'c_sp6', title: '[Udemy] Preparacion al DELE B2', total: 26, daily: 1, loops: 1, days: [0], cat: 'cat_spanish', order: 7, deadline: '2027-11-10' },
                    { id: 'c_it1', title: '[Hahow 好學校] Power BI', total: 6, daily: 1, loops: 1, days: [6], cat: 'cat_it', order: 8, deadline: '2028-03-31' },
                    { id: 'c_it2', title: '[Udemy] Python数据分析：从小白到高手', total: 9, daily: 1, loops: 1, days: [6], cat: 'cat_it', order: 9, deadline: '2028-03-31' },
                    { id: 'c_it3', title: '[Udemy] Python 資料分析 - 入門實戰', total: 14, daily: 1, loops: 1, days: [6], cat: 'cat_it', order: 10, deadline: '2028-03-31' },
                    { id: 'c_it4', title: '[Udemy] Unlock Excel VBA and Excel Macros', total: 20, daily: 1, loops: 1, days: [6], cat: 'cat_it', order: 11, deadline: '2028-03-31' }
                ]
            };
            localStorage.setItem('deleAppSettings', JSON.stringify(appSettings));
        }

        let completedTasks = new Set(JSON.parse(localStorage.getItem('deleCompletedTasks') || '[]')); 
        let vacationSet = new Set(JSON.parse(localStorage.getItem('deleVacationDates') || '[]'));
        let customTasks = JSON.parse(localStorage.getItem('deleCustomTasks') || '{}');
        let taskMoves = JSON.parse(localStorage.getItem('deleTaskMoves') || '{}');
        let courseVacations = JSON.parse(localStorage.getItem('deleCourseVacations') || '{}');
        let scheduleCache = {};

        function saveHistory() {
            historyStack.push({
                completedTasks: [...completedTasks],
                vacationSet: [...vacationSet],
                customTasks: JSON.parse(JSON.stringify(customTasks)),
                taskMoves: JSON.parse(JSON.stringify(taskMoves)),
                courseVacations: JSON.parse(JSON.stringify(courseVacations))
            });
            if (historyStack.length > 20) historyStack.shift();
            updateUndoBtn();
        }

        function undoLastAction() {
            if (historyStack.length === 0) return;
            const state = historyStack.pop();
            completedTasks = new Set(state.completedTasks);
            vacationSet = new Set(state.vacationSet);
            customTasks = state.customTasks;
            taskMoves = state.taskMoves;
            courseVacations = state.courseVacations;
            
            localStorage.setItem('deleCompletedTasks', JSON.stringify([...completedTasks]));
            localStorage.setItem('deleVacationDates', JSON.stringify([...vacationSet]));
            localStorage.setItem('deleCustomTasks', JSON.stringify(customTasks));
            localStorage.setItem('deleTaskMoves', JSON.stringify(taskMoves));
            localStorage.setItem('deleCourseVacations', JSON.stringify(courseVacations));
            
            buildScheduleCache();
            renderMonth(currentDisplayYear, currentDisplayMonth);
            updateUndoBtn();
        }

        function updateUndoBtn() {
            const btnDesktop = document.getElementById('undo-btn');
            const btnMobile = document.getElementById('mobile-undo-btn');
            const hasHistory = historyStack.length > 0;
            
            [btnDesktop, btnMobile].forEach(btn => {
                if(!btn) return;
                if (hasHistory) {
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.classList.add('opacity-100', 'hover:bg-theme-burgundy-light');
                } else {
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                    btn.classList.remove('opacity-100', 'hover:bg-theme-burgundy-light');
                }
            });
        }

        function buildScheduleCache() {
            scheduleCache = {};
            let d = parseDateStr(appSettings.startDate);
            let endDStr = appSettings.maxDeadline || '2028-03-31';
            const endD = parseDateStr(endDStr);
            
            let pointers = {};
            appSettings.categories.forEach(cat => { pointers[cat.id] = { i: 0, ch: 1 }; });
            
            while(d <= endD) {
                const dateStr = formatDateStr(d);
                const dayOfWeek = d.getDay();
                let dayTasks = [];

                if (!vacationSet.has(dateStr)) {
                    appSettings.categories.forEach(cat => {
                        let coursesInCat = appSettings.courses.filter(c => c.cat === cat.id);
                        coursesInCat.sort((a, b) => (a.order || 99) - (b.order || 99));
                        if (coursesInCat.length === 0) return;
                        
                        let p = pointers[cat.id];
                        
                        while (p.i < coursesInCat.length) {
                            let checkCourse = coursesInCat[p.i];
                            if (checkCourse.deadline && checkCourse.deadline.trim() !== '') {
                                let limitDate = parseDateStr(checkCourse.deadline);
                                if (d > limitDate) {
                                    p.i++; p.ch = 1; 
                                    continue;
                                }
                            }
                            break;
                        }

                        if (p.i >= coursesInCat.length) return; 

                        let c = coursesInCat[p.i];
                        if (c.days.includes(dayOfWeek)) {
                            if (courseVacations[c.id] && courseVacations[c.id].includes(dateStr)) {
                                // 科目順延休假跳過
                            } else {
                                let cTotal = parseFloat(c.total) || 1;
                                let cDaily = parseFloat(c.daily) || 1;
                                let cLoops = parseInt(c.loops) || 1;
                                
                                let neededDays = Math.ceil(cTotal / cDaily);
                                let totalNeededDays = neededDays * cLoops;
                                
                                let currentLoop = Math.ceil(p.ch / neededDays);
                                let currentChapter = ((p.ch - 1) % neededDays) + 1;
                                
                                let title = c.title;
                                if (cLoops > 1) {
                                    title += ` [第${currentLoop}輪] (進度 ${currentChapter}/${neededDays})`;
                                } else if (neededDays > 1) {
                                    title += ` (進度 ${currentChapter}/${neededDays})`;
                                }
                                
                                dayTasks.push({ 
                                    id: `${cat.id}_${c.id}`, 
                                    title: title, 
                                    type: cat.id, 
                                    baseId: c.id,
                                    time: cDaily
                                });

                                p.ch++;
                                if (p.ch > totalNeededDays) { p.i++; p.ch = 1; }
                            }
                        }
                    });
                }
                scheduleCache[dateStr] = dayTasks;
                d.setDate(d.getDate() + 1);
            }
        }

        function renderMonth(year, month) {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            document.getElementById('current-month-display').innerText = `${year}年 ${month + 1}月`;
            
            let firstDay = new Date(year, month, 1);
            let lastDay = new Date(year, month + 1, 0);
            
            for (let d = new Date(firstDay); d <= lastDay; d.setDate(d.getDate() + 1)) {
                const dateStr = formatDateStr(d);
                const isToday = dateStr === formatDateStr(REAL_TODAY);
                const isVacationDay = vacationSet.has(dateStr);
                
                let tasksToRender = getTasksForDate(dateStr);
                let totalDailyHours = tasksToRender.reduce((sum, task) => sum + (parseFloat(task.time) || 0), 0);
                
                const dayCard = document.createElement('div');
                dayCard.className = `bg-white rounded-xl shadow-sm border ${isToday ? 'border-theme-navy ring-1 ring-theme-navy' : 'border-slate-200'} p-3 md:p-4 min-h-[140px] md:min-h-[160px] flex flex-col relative transition-colors ${isVacationDay ? 'bg-orange-50' : ''}`;
                
                const dateNum = d.getDate();
                const weekStr = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
                
                let hoursDisplay = !isVacationDay && totalDailyHours > 0 
                    ? `<span class="text-[9px] md:text-[10px] font-bold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded ml-1.5 shadow-inner">⏱ ${totalDailyHours} h</span>` 
                    : '';

                dayCard.innerHTML = `
                    <div class="flex justify-between items-center mb-2 md:mb-3 pb-2 border-b border-slate-100">
                        <div class="flex items-baseline">
                            <span class="text-lg md:text-xl font-bold ${isToday ? 'text-theme-navy' : 'text-slate-700'}">${dateNum}</span>
                            <span class="text-[10px] md:text-xs font-medium text-slate-400 ml-1">週${weekStr}</span>
                            ${hoursDisplay}
                        </div>
                        <button onclick="toggleVacation('${dateStr}')" class="text-[9px] md:text-[10px] px-1.5 md:px-2 py-1 rounded border ${isVacationDay ? 'bg-orange-100 text-orange-700 border-orange-200' : 'bg-slate-50 text-slate-500 border-slate-200 hover:bg-slate-100'} transition active:scale-95">
                            ${isVacationDay ? '休假中' : '設為緩衝'}
                        </button>
                    </div>
                    <div class="space-y-2 flex-grow min-h-[40px]" id="tasks-${dateStr}" 
                         ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" ondragover="event.preventDefault()" ondrop="drop(event, '${dateStr}')">
                    </div>
                `;
                
                grid.appendChild(dayCard);
                const taskContainer = dayCard.querySelector(`#tasks-${dateStr}`);
                
                if (isVacationDay) {
                    taskContainer.innerHTML = `<div class="text-[11px] md:text-xs text-orange-400 text-center py-3 flex flex-col items-center"><i class="fa-solid fa-mug-hot mb-1 opacity-50"></i>整日進度順延</div>`;
                } else if (tasksToRender.length === 0) {
                    taskContainer.innerHTML = `<div class="text-[9px] md:text-[10px] text-slate-300 text-center py-2">無排程</div>`;
                } else {
                    tasksToRender.forEach(task => {
                        const isDone = completedTasks.has(task.uniqueId);
                        const isMoved = Object.values(taskMoves).includes(task.uniqueId) && !task.isCustom;

                        const taskEl = document.createElement('label');
                        taskEl.className = `flex items-start p-1.5 md:p-2 rounded border cursor-pointer transition-all ${isDone ? 'bg-slate-50 border-slate-100 opacity-60' : 'bg-white border-slate-200 hover:border-theme-navy hover:shadow-sm'} ${task.isPending ? 'border-amber-300 bg-amber-50' : ''}`;
                        taskEl.draggable = true;
                        
                        let pureBaseId = task.baseId || '';
                        
                        taskEl.setAttribute('ondragstart', `drag(event, '${task.uniqueId}', '${task.originalDate}', ${task.isCustom}, '${dateStr}', '${pureBaseId}')`);

                        let catObj = appSettings.categories.find(c => c.id === task.type);
                        let colorClass = catObj ? `tag-${catObj.color}` : 'tag-slate';
                        let timeBadge = task.time ? `<span class="text-[8px] md:text-[9px] font-medium text-slate-400 ml-1 border rounded px-1">⏱ ${task.time}h</span>` : '';
                        let prefixHtml = task.isPending 
                            ? `<span class="inline-block px-1.5 py-0.5 rounded text-[8px] md:text-[9px] font-bold bg-amber-200 text-amber-800 mb-1 leading-none mr-1"><i class="fa-solid fa-rotate mr-0.5"></i>待補(原${task.originalDate.substr(5)})</span>` 
                            : '';
                        
                        if (isMoved && !task.isPending) {
                            prefixHtml += `<span class="inline-block px-1.5 py-0.5 rounded text-[8px] md:text-[9px] font-bold bg-slate-200 text-slate-600 mb-1 leading-none mr-1">手動移入</span>`;
                        }

                        taskEl.innerHTML = `
                            <div class="mr-1.5 md:mr-2 mt-0.5 text-slate-300 cursor-grab hover:text-slate-500 px-0.5"><i class="fa-solid fa-grip-vertical text-[9px] md:text-[10px]"></i></div>
                            <div class="relative flex items-center justify-center w-3 h-3 md:w-4 md:h-4 mr-2 border border-slate-300 rounded shrink-0 bg-white checkbox-wrapper transition-colors mt-[3px]">
                                <input type="checkbox" class="opacity-0 absolute inset-0 cursor-pointer checkbox-custom" 
                                       ${isDone ? 'checked' : ''} 
                                       onchange="toggleTask('${task.uniqueId}', this.checked)">
                                <div class="pointer-events-none absolute inset-0 flex items-center justify-center rounded transition-colors">
                                    <svg class="w-2 h-2 md:w-2.5 md:h-2.5 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                            </div>
                            <div class="flex-grow min-w-0">
                                <span class="inline-block px-1.5 py-[2px] rounded text-[7px] md:text-[8px] font-bold mb-1 leading-none ${colorClass}">${catObj ? catObj.name : '自訂任務'}</span>
                                <br>
                                <div class="text-[10px] md:text-[11px] leading-tight font-medium ${isDone ? 'text-slate-400 line-through' : 'text-slate-700'} break-words">
                                    ${prefixHtml}${task.title} ${timeBadge}
                                </div>
                            </div>
                        `;
                        taskContainer.appendChild(taskEl);
                    });
                }
            }
        }

        function getTasksForDate(dateStr) {
            let tasks = [];
            let isRealToday = dateStr === formatDateStr(REAL_TODAY);
            
            let baseTasks = scheduleCache[dateStr] || [];
            baseTasks.forEach(bt => {
                let uId = `${bt.id}_${dateStr}`;
                if (taskMoves[uId] && taskMoves[uId] !== dateStr) return;
                tasks.push({ uniqueId: uId, title: bt.title, type: bt.type, originalDate: dateStr, isCustom: false, baseId: bt.baseId, isPending: false, time: bt.time });
            });

            for (let uId in taskMoves) {
                if (taskMoves[uId] === dateStr) {
                    let parts = uId.split('_'); 
                    let origDate = parts.pop();
                    let fullIdWithoutDate = parts.join('_');
                    let baseIdFromParts = parts.slice(1).join('_');
                    let origTask = (scheduleCache[origDate] || []).find(t => t.id === fullIdWithoutDate || t.baseId === baseIdFromParts);
                    if (origTask) tasks.push({ uniqueId: uId, title: origTask.title, type: origTask.type, originalDate: origDate, isCustom: false, baseId: origTask.baseId, isPending: false, time: origTask.time });
                }
            }

            let ct = customTasks[dateStr] || [];
            ct.forEach(t => tasks.push({ uniqueId: t.id, title: t.title, type: t.cat || 'cat_it', originalDate: dateStr, isCustom: true, baseId: null, isPending: false, time: t.time }));

            if (isRealToday) {
                let pending = [];
                let d = parseDateStr(appSettings.startDate);
                let yesterday = new Date(REAL_TODAY);
                yesterday.setDate(yesterday.getDate() - 1);
                
                while(d <= yesterday) {
                    let dStr = formatDateStr(d);
                    if (!vacationSet.has(dStr)) {
                        let pastTasks = getTasksForDateOnly(dStr);
                        pastTasks.forEach(pt => {
                            if (!completedTasks.has(pt.uniqueId)) {
                                pt.isPending = true;
                                pending.push(pt);
                            }
                        });
                    }
                    d.setDate(d.getDate() + 1);
                }
                tasks = [...pending, ...tasks];
            }
            return tasks;
        }

        function getTasksForDateOnly(dateStr) {
            let tasks = [];
            (scheduleCache[dateStr] || []).forEach(bt => {
                let uId = `${bt.id}_${dateStr}`;
                if (taskMoves[uId] && taskMoves[uId] !== dateStr) return;
                tasks.push({ uniqueId: uId, title: bt.title, originalDate: dateStr, isCustom: false, baseId: bt.baseId, time: bt.time });
            });
            for (let uId in taskMoves) {
                if (taskMoves[uId] === dateStr) {
                    let parts = uId.split('_'); 
                    let origDate = parts.pop();
                    let fullIdWithoutDate = parts.join('_');
                    let baseIdFromParts = parts.slice(1).join('_');
                    let origTask = (scheduleCache[origDate] || []).find(t => t.id === fullIdWithoutDate || t.baseId === baseIdFromParts);
                    if (origTask) tasks.push({ uniqueId: uId, title: origTask.title, originalDate: origDate, isCustom: false, baseId: origTask.baseId, time: origTask.time });
                }
            }
            (customTasks[dateStr] || []).forEach(t => tasks.push({ uniqueId: t.id, title: t.title, originalDate: dateStr, isCustom: true, baseId: null, time: t.time }));
            return tasks;
        }

        function dragEnter(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-active'); }
        function dragLeave(ev) { ev.currentTarget.classList.remove('drag-active'); }
        
        function drag(ev, taskId, originalDate, isCustom, currentDate, baseId) {
            ev.dataTransfer.setData("taskId", taskId);
            ev.dataTransfer.setData("originalDate", originalDate);
            ev.dataTransfer.setData("isCustom", isCustom);
            ev.dataTransfer.setData("currentDate", currentDate);
            ev.dataTransfer.setData("baseId", baseId);
        }
        
        function drop(ev, toDateStr) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-active');
            
            const taskId = ev.dataTransfer.getData("taskId");
            const originalDate = ev.dataTransfer.getData("originalDate");
            const isCustom = ev.dataTransfer.getData("isCustom") === 'true';
            const currentDate = ev.dataTransfer.getData("currentDate");
            let baseId = ev.dataTransfer.getData("baseId");

            if (currentDate === toDateStr) return;
            saveHistory();

            if (isCustom) {
                let ctList = customTasks[currentDate] || [];
                let idx = ctList.findIndex(t => t.id === taskId);
                if (idx > -1) {
                    let task = ctList.splice(idx, 1)[0];
                    if (!customTasks[toDateStr]) customTasks[toDateStr] = [];
                    customTasks[toDateStr].push(task);
                    localStorage.setItem('deleCustomTasks', JSON.stringify(customTasks));
                    renderMonth(currentDisplayYear, currentDisplayMonth);
                }
            } else {
                let fromTime = parseDateStr(currentDate).getTime();
                let toTime = parseDateStr(toDateStr).getTime();
                
                if(!baseId || baseId === 'undefined') {
                    const parts = taskId.split('_');
                    if (parts.length >= 3) baseId = parts.slice(1, -1).join('_');
                }

                if (baseId && toDateStr !== currentDate) {
                    let direction = toTime > fromTime ? 'forward' : 'backward';
                    dragContext = { uniqueId: taskId, originalDate, currentDate, toDateStr, courseId: baseId, direction };
                    
                    const mTitle = document.getElementById('drag-modal-title');
                    const mDesc = document.getElementById('drag-modal-desc');
                    const mBtnText = document.getElementById('drag-modal-cascade-text');
                    const mBtnSub = document.getElementById('drag-modal-cascade-sub');

                    if (direction === 'forward') {
                        mTitle.innerHTML = '<i class="fa-solid fa-layer-group text-xl md:text-2xl mr-3"></i>排程延後確認';
                        mDesc.innerText = '您正在將章節往後推遲，請問要連同後續章節一起順延嗎？';
                        mBtnText.innerHTML = '<i class="fa-solid fa-forward-step mr-1"></i> 整串自動順延 (推薦)';
                        mBtnSub.innerText = '此科目後續的章節將自動往後推遲排程';
                    } else {
                        mTitle.innerHTML = '<i class="fa-solid fa-layer-group text-xl md:text-2xl mr-3"></i>排程提前/歸位確認';
                        mDesc.innerText = '您正在將章節移回較早的日期。請問是否要將後續章節也一併提前？';
                        mBtnText.innerHTML = '<i class="fa-solid fa-backward-step mr-1"></i> 整串自動提前 (復原順延)';
                        mBtnSub.innerText = '消除此科目在這段期間的順延紀錄，讓後續章節往前補上';
                    }
                    document.getElementById('drag-confirm-modal').classList.remove('hidden');
                } else {
                    executeSingleMove(taskId, toDateStr, originalDate);
                }
            }
        }

        function executeSingleMove(taskId, toDateStr, originalDate) {
            if (toDateStr === originalDate) delete taskMoves[taskId];
            else taskMoves[taskId] = toDateStr;
            localStorage.setItem('deleTaskMoves', JSON.stringify(taskMoves));
            renderMonth(currentDisplayYear, currentDisplayMonth);
        }

        function closeDragModal() {
            document.getElementById('drag-confirm-modal').classList.add('hidden');
            dragContext = null;
        }

        function handleDragChoice(choice) {
            if (!dragContext) return;
            if (choice === 'single') {
                executeSingleMove(dragContext.uniqueId, dragContext.toDateStr, dragContext.originalDate);
            } else if (choice === 'cascade') {
                let course = appSettings.courses.find(c => c.id === dragContext.courseId);
                if (!course) { closeDragModal(); return; } 
                
                if (!courseVacations[course.id]) courseVacations[course.id] = [];
                
                let loopDate, targetDate;
                if (dragContext.direction === 'forward') {
                    loopDate = parseDateStr(dragContext.currentDate);
                    targetDate = parseDateStr(dragContext.toDateStr);
                    while(loopDate < targetDate) {
                        let ds = formatDateStr(loopDate);
                        if (course.days.includes(loopDate.getDay()) && !vacationSet.has(ds)) {
                            if (!courseVacations[course.id].includes(ds)) courseVacations[course.id].push(ds);
                        }
                        loopDate.setDate(loopDate.getDate() + 1);
                    }
                } else {
                    loopDate = parseDateStr(dragContext.toDateStr);
                    targetDate = parseDateStr(dragContext.currentDate);
                    while(loopDate < targetDate) {
                        let ds = formatDateStr(loopDate);
                        let idx = courseVacations[course.id].indexOf(ds);
                        if (idx > -1) courseVacations[course.id].splice(idx, 1);
                        loopDate.setDate(loopDate.getDate() + 1);
                    }
                }
                
                localStorage.setItem('deleCourseVacations', JSON.stringify(courseVacations));
                
                if (dragContext.toDateStr === dragContext.originalDate) {
                    delete taskMoves[dragContext.uniqueId];
                } else {
                    taskMoves[dragContext.uniqueId] = dragContext.toDateStr;
                }
                localStorage.setItem('deleTaskMoves', JSON.stringify(taskMoves));
                
                buildScheduleCache();
            }
            closeDragModal();
            renderMonth(currentDisplayYear, currentDisplayMonth);
        }

        function toggleTask(taskId, isCompleted) {
            saveHistory();
            if (isCompleted) completedTasks.add(taskId);
            else completedTasks.delete(taskId);
            localStorage.setItem('deleCompletedTasks', JSON.stringify([...completedTasks]));
            renderMonth(currentDisplayYear, currentDisplayMonth);
        }

        function toggleVacation(dateStr) {
            saveHistory();
            if (vacationSet.has(dateStr)) vacationSet.delete(dateStr);
            else vacationSet.add(dateStr);
            localStorage.setItem('deleVacationDates', JSON.stringify([...vacationSet]));
            buildScheduleCache();
            renderMonth(currentDisplayYear, currentDisplayMonth);
        }

        function updateCountdown() {
            let targetStr = appSettings.countdownDate || '2027-11-13';
            const target = parseDateStr(targetStr);
            const diff = target - REAL_TODAY;
            const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
            const finalDays = days > 0 ? days : 0;
            
            const cdDesk = document.getElementById('countdown-days');
            if(cdDesk) cdDesk.innerText = finalDays;
            
            const cdMob = document.getElementById('mobile-countdown-days');
            if(cdMob) cdMob.innerText = finalDays;
        }

        function changeMonth(delta) {
            currentDisplayMonth += delta;
            if (currentDisplayMonth > 11) { currentDisplayMonth = 0; currentDisplayYear++; }
            if (currentDisplayMonth < 0) { currentDisplayMonth = 11; currentDisplayYear--; }
            renderMonth(currentDisplayYear, currentDisplayMonth);
        }

        function resetToToday() {
            currentDisplayYear = REAL_TODAY.getFullYear();
            currentDisplayMonth = REAL_TODAY.getMonth();
            renderMonth(currentDisplayYear, currentDisplayMonth);
        }

        function changeTab(tabId) {
            ['dashboard', 'archive', 'settings'].forEach(id => {
                document.getElementById(`view-${id}`).classList.add('hidden');
                const nav = document.getElementById(`nav-${id}`);
                nav.classList.remove('bg-theme-navy-light', 'text-white', 'border-white/20');
                nav.classList.add('text-slate-300', 'border-transparent');
            });

            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tabId}`);
            activeNav.classList.remove('text-slate-300', 'border-transparent');
            activeNav.classList.add('bg-theme-navy-light', 'text-white', 'border-white/20');

            if (tabId === 'settings') {
                document.getElementById('set-start-date').value = appSettings.startDate;
                document.getElementById('set-max-deadline').value = appSettings.maxDeadline || '2028-03-31';
                document.getElementById('set-countdown-date').value = appSettings.countdownDate || '2027-11-10';
                renderCoursesSettings();
            } else if (tabId === 'archive') {
                renderArchive();
            }
        }

        function saveToArchive(type) {
            const inputMap = { 'memo': 'memo-input', 'knowledge': 'knowledge-input', 'milestone': 'milestone-input' };
            const el = document.getElementById(inputMap[type]);
            const text = el.value.trim();
            if (!text) return;

            let notes = JSON.parse(localStorage.getItem('deleNotesList') || '[]');
            notes.unshift({ id: 'n_' + Date.now(), type: type, content: text, date: formatDateStr(REAL_TODAY), completed: false });
            localStorage.setItem('deleNotesList', JSON.stringify(notes));
            
            const btn = el.nextElementSibling;
            const oldHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check-double text-green-500"></i>';
            setTimeout(() => { btn.innerHTML = oldHtml; }, 1500);
            
            el.value = '';
            if(!document.getElementById('view-archive').classList.contains('hidden')){ renderArchive(); }
        }

        function renderArchive() {
            const notes = JSON.parse(localStorage.getItem('deleNotesList') || '[]');
            const notesContainer = document.getElementById('archive-notes-container');
            const milestoneContainer = document.getElementById('archive-milestone-container');
            
            if(!notesContainer || !milestoneContainer) return;
            notesContainer.innerHTML = ''; milestoneContainer.innerHTML = '';
            
            const filteredNotes = notes.filter(n => n.type !== 'milestone' && (currentArchiveFilter === 'all' || n.type === currentArchiveFilter));
            
            if (filteredNotes.length === 0) {
                notesContainer.innerHTML = `<div class="col-span-full py-10 text-center text-slate-400 text-xs md:text-sm">目前沒有相關紀錄。</div>`;
            } else {
                filteredNotes.forEach(note => {
                    const typeStyles = note.type === 'memo' ? 'text-theme-navy bg-slate-100 border-slate-200' : 'text-theme-burgundy bg-rose-50 border-rose-100';
                    const typeText = note.type === 'memo' ? '隨筆備忘' : '知識點';
                    notesContainer.innerHTML += `
                        <div class="bg-white p-3 md:p-4 rounded-xl border border-slate-200 shadow-sm relative group hover:shadow-md transition-shadow">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[9px] md:text-[10px] font-bold border px-1.5 py-0.5 rounded uppercase ${typeStyles}">${typeText}</span>
                                <span class="text-[9px] md:text-[10px] text-slate-400 font-medium">${note.date}</span>
                            </div>
                            <p class="text-xs md:text-sm text-slate-700 whitespace-pre-wrap leading-relaxed">${note.content}</p>
                            <button onclick="deleteNote('${note.id}')" class="absolute bottom-2 md:bottom-3 right-2 md:right-3 text-slate-300 hover:text-red-500 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition p-1.5 active:scale-90"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    `;
                });
            }

            const milestones = notes.filter(n => n.type === 'milestone');
            if(milestones.length === 0){
                milestoneContainer.innerHTML = `<p class="text-[11px] md:text-xs text-center text-slate-400 py-4">無待辦里程碑</p>`;
            } else {
                milestones.forEach(m => {
                    milestoneContainer.innerHTML += `
                        <div class="flex items-start group p-1">
                            <input type="checkbox" ${m.completed ? 'checked' : ''} onchange="toggleMilestone('${m.id}', this.checked)" class="mt-0.5 md:mt-1 mr-2 cursor-pointer text-amber-600 focus:ring-amber-500 rounded border-slate-300">
                            <span class="text-xs md:text-sm ${m.completed ? 'text-slate-400 line-through' : 'text-slate-700'} flex-grow">${m.content}</span>
                            <button onclick="deleteNote('${m.id}')" class="text-slate-300 hover:text-red-500 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition ml-2 p-1 active:scale-90"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    `;
                });
            }
        }

        function setArchiveFilter(type) {
            currentArchiveFilter = type;
            ['all', 'knowledge', 'memo'].forEach(t => {
                const btn = document.getElementById('btn-arc-' + t);
                if(t === type) {
                    btn.classList.add('bg-theme-navy', 'text-white', 'shadow-sm');
                    btn.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
                } else {
                    btn.classList.remove('bg-theme-navy', 'text-white', 'shadow-sm');
                    btn.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
                }
            });
            renderArchive();
        }

        function deleteNote(id) {
            let notes = JSON.parse(localStorage.getItem('deleNotesList') || '[]');
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('deleNotesList', JSON.stringify(notes));
            renderArchive();
        }

        function toggleMilestone(id, checked) {
            let notes = JSON.parse(localStorage.getItem('deleNotesList') || '[]');
            let note = notes.find(n => n.id === id);
            if(note) { note.completed = checked; localStorage.setItem('deleNotesList', JSON.stringify(notes)); renderArchive(); }
        }

        function openTagManager() { renderTagsList(); document.getElementById('tag-manager-modal').classList.remove('hidden'); }
        function closeTagManager() { document.getElementById('tag-manager-modal').classList.add('hidden'); renderCoursesSettings(); }
        
        function renderTagsList() {
            const container = document.getElementById('tags-list-container');
            container.innerHTML = '';
            appSettings.categories.forEach((cat, idx) => {
                container.innerHTML += `
                    <div class="flex items-center justify-between p-2.5 bg-white border border-slate-200 rounded shadow-sm">
                        <div class="flex items-center space-x-3">
                            <span class="inline-block w-3 h-3 rounded-full tag-${cat.color}"></span>
                            <span class="text-[11px] md:text-xs font-medium text-slate-700">${cat.name}</span>
                        </div>
                        <button onclick="deleteTag(${idx})" class="text-slate-300 hover:text-red-500 transition p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                `;
            });
        }
        function addTag() {
            const name = document.getElementById('new-tag-name').value.trim();
            const color = document.getElementById('new-tag-color').value;
            if(!name) return;
            appSettings.categories.push({ id: 'cat_' + Date.now(), name: name, color: color });
            localStorage.setItem('deleAppSettings', JSON.stringify(appSettings));
            document.getElementById('new-tag-name').value = '';
            renderTagsList();
        }
        function deleteTag(idx) {
            if(appSettings.categories.length <= 1) { alert("請至少保留一個標籤！"); return; }
            appSettings.categories.splice(idx, 1);
            localStorage.setItem('deleAppSettings', JSON.stringify(appSettings));
            renderTagsList();
        }

        function renderCoursesSettings() {
            const container = document.getElementById('courses-list-container');
            container.innerHTML = '';
            appSettings.courses.forEach((c, index) => { container.insertAdjacentHTML('beforeend', generateCourseHTML(c, index)); });
        }

        function generateCourseHTML(c, index) {
            const daysLabel = ['日', '一', '二', '三', '四', '五', '六'];
            let daysHTML = daysLabel.map((day, dIdx) => `
                <label class="flex items-center space-x-1 cursor-pointer bg-white px-1.5 md:px-2 py-1 md:py-1.5 rounded shadow-sm border border-slate-200 hover:border-theme-navy transition select-none active:scale-95">
                    <input type="checkbox" value="${dIdx}" class="course-day-cb form-checkbox h-3 w-3 text-theme-navy rounded" ${c.days.includes(dIdx) ? 'checked' : ''}>
                    <span class="text-[9px] md:text-[10px] text-slate-600 font-medium">${day}</span>
                </label>
            `).join('');

            let catOptionsHTML = appSettings.categories.map(cat => `<option value="${cat.id}" ${c.cat === cat.id ? 'selected' : ''}>${cat.name}</option>`).join('');

            return `
            <div class="bg-white p-3 md:p-4 rounded-lg border border-slate-200 relative shadow-sm course-item hover:border-slate-300 transition" data-id="${c.id || 'c_'+Date.now()}">
                <button onclick="removeCourseUI(this)" class="absolute top-2 right-2 text-slate-300 hover:text-red-500 transition bg-slate-50 hover:bg-slate-100 rounded-full p-1.5 active:scale-90"><i class="fa-solid fa-times"></i></button>
                <div class="mb-3 pr-8">
                    <label class="text-[9px] md:text-[10px] font-bold text-slate-400 mb-1 block uppercase tracking-wide">專案資源名稱</label>
                    <input type="text" class="c-title w-full text-xs md:text-sm font-medium p-1 border-b border-dashed border-slate-300 focus:border-theme-navy focus:outline-none bg-transparent text-theme-navy" value="${c.title}">
                </div>
                <div class="grid grid-cols-2 md:grid-cols-6 gap-2 md:gap-3 mb-4">
                    <div class="bg-slate-50 p-2 rounded border border-slate-100 shadow-sm">
                        <label class="text-[8px] md:text-[9px] font-bold text-slate-500 mb-1 block uppercase">分類標籤</label>
                        <select class="c-cat w-full text-[10px] md:text-xs p-1 border border-slate-200 rounded focus:border-theme-navy focus:outline-none bg-white">${catOptionsHTML}</select>
                    </div>
                    <div class="bg-slate-50 p-2 rounded border border-slate-100 shadow-sm">
                        <label class="text-[8px] md:text-[9px] font-bold text-slate-500 mb-1 block uppercase">總量(時/章)</label>
                        <input type="number" step="0.5" min="0.5" class="c-total w-full text-[10px] md:text-xs p-1 border border-slate-200 rounded focus:border-theme-navy focus:outline-none bg-white" value="${c.total}">
                    </div>
                    <div class="bg-slate-50 p-2 rounded border border-slate-100 shadow-sm">
                        <label class="text-[8px] md:text-[9px] font-bold text-theme-burgundy mb-1 block uppercase">每日學習(hr)</label>
                        <input type="number" step="0.5" min="0.5" class="c-daily w-full text-[10px] md:text-xs p-1 border border-red-100 rounded focus:border-theme-burgundy focus:outline-none bg-white" value="${c.daily || 1}">
                    </div>
                    <div class="bg-purple-50 p-2 rounded border border-purple-100 shadow-sm">
                        <label class="text-[8px] md:text-[9px] font-bold text-purple-800 mb-1 block uppercase">循環次數</label>
                        <input type="number" min="1" class="c-loops w-full text-[10px] md:text-xs p-1 border border-purple-200 rounded focus:border-purple-500 focus:outline-none bg-white text-purple-700" value="${c.loops || 1}">
                    </div>
                    <div class="bg-slate-50 p-2 rounded border border-slate-100 shadow-sm">
                        <label class="text-[8px] md:text-[9px] font-bold text-slate-500 mb-1 block uppercase">優先順序 <i class="fa-solid fa-circle-info opacity-50"></i></label>
                        <input type="number" min="1" class="c-order w-full text-[10px] md:text-xs p-1 border border-slate-200 rounded focus:border-theme-navy focus:outline-none bg-white" value="${c.order || (index + 1)}">
                    </div>
                    <div class="bg-red-50 p-2 rounded border border-red-100 shadow-sm">
                        <label class="text-[8px] md:text-[9px] font-bold text-red-800 mb-1 block uppercase">單獨截止日</label>
                        <input type="date" class="c-deadline w-full text-[10px] md:text-xs p-1 border border-red-200 rounded focus:border-red-500 focus:outline-none bg-white text-red-700" value="${c.deadline || ''}">
                    </div>
                </div>
                <div>
                    <label class="text-[8px] md:text-[9px] font-bold text-slate-500 mb-1.5 block uppercase">每週排定執行日</label>
                    <div class="flex flex-wrap gap-1.5 md:gap-2">
                        ${daysHTML}
                    </div>
                </div>
            </div>
            `;
        }

        function addNewCourseUI() {
            const container = document.getElementById('courses-list-container');
            const defaultCat = appSettings.categories.length > 0 ? appSettings.categories[0].id : 'cat_it';
            const newCourse = { id: 'c_' + Date.now(), title: '新排程任務', total: 10, daily: 1, loops: 1, days: [1,2,3,4,5], cat: defaultCat, order: 99, deadline: '' };
            container.insertAdjacentHTML('afterbegin', generateCourseHTML(newCourse, 999));
        }

        function removeCourseUI(btn) { btn.closest('.course-item').remove(); }

        function saveSettings() {
            try {
                const sd = document.getElementById('set-start-date').value;
                const md = document.getElementById('set-max-deadline').value;
                const cd = document.getElementById('set-countdown-date').value;
                
                if (!sd || !md || !cd) { alert('請確定所有的整體日期設定皆已填寫！'); return; }

                let newCourses = [];
                document.querySelectorAll('.course-item').forEach(item => {
                    let title = item.querySelector('.c-title').value.trim();
                    let total = parseFloat(item.querySelector('.c-total').value) || 1;
                    let daily = parseFloat(item.querySelector('.c-daily').value) || 1;
                    let loops = parseInt(item.querySelector('.c-loops').value) || 1;
                    let cat = item.querySelector('.c-cat').value;
                    let order = parseInt(item.querySelector('.c-order').value) || 99;
                    let deadline = item.querySelector('.c-deadline').value;
                    let id = item.getAttribute('data-id');
                    let days = [];
                    item.querySelectorAll('.course-day-cb:checked').forEach(cb => { days.push(parseInt(cb.value)); });
                    if(title && days.length > 0) {
                        newCourses.push({ id: id, title: title, total: total, daily: daily, loops: loops, cat: cat, days: days, order: order, deadline: deadline });
                    }
                });

                if(newCourses.length === 0) { alert('請至少保留一項專案資源，並且勾選執行日！'); return; }

                saveHistory();
                appSettings.startDate = sd;
                appSettings.maxDeadline = md;
                appSettings.countdownDate = cd;
                appSettings.courses = newCourses;
                
                localStorage.setItem('deleAppSettings', JSON.stringify(appSettings));
                
                updateCountdown();
                buildScheduleCache();
                renderMonth(currentDisplayYear, currentDisplayMonth);
                
                changeTab('dashboard');
            } catch (e) {
                console.error(e);
                alert('設定儲存發生錯誤，請檢查輸入內容！');
            }
        }

        window.onload = function() {
            document.getElementById('today-date-display').innerText = `${REAL_TODAY.getFullYear()}年 ${REAL_TODAY.getMonth()+1}月 ${REAL_TODAY.getDate()}日`;
            
            updateCountdown();
            updateUndoBtn();
            buildScheduleCache();
            renderArchive();
            renderMonth(currentDisplayYear, currentDisplayMonth);
            
            const pStart = parseDateStr(appSettings.startDate);
            if (REAL_TODAY < pStart) {
                currentDisplayYear = pStart.getFullYear();
                currentDisplayMonth = pStart.getMonth();
                renderMonth(currentDisplayYear, currentDisplayMonth);
            }
        };
    </script>
</body>
</html>
